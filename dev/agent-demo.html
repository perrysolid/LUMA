<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LUMA agent demo</title>
    <link rel="stylesheet" href="/src/overlay/overlay.css" />
    <style>
      html, body { pointer-events: auto; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <iframe id="app" src="/eval/fixtures/github.html"></iframe>
    <svg id="stage" xmlns="http://www.w3.org/2000/svg">
      <g id="layer-spot"></g><g id="layer-shapes"></g><g id="layer-arrows"></g><g id="layer-steps"></g>
    </svg>
    <div id="labels"></div>
    <div id="pointer" hidden data-state="acting">
      <svg viewBox="0 0 32 32" width="26" height="26"><path d="M4 3 L27 14 L16.5 17 L12 28 Z" /></svg>
      <div class="buddy-badge" hidden><i></i><i></i><i></i></div>
      <div class="pointer-label" hidden></div>
    </div>
    <div id="hud" hidden>
      <div class="hud-row"><span class="hud-dot"></span><span class="hud-meter" hidden><i></i><i></i><i></i><i></i><i></i></span><span class="hud-text"></span></div>
      <div class="hud-sub" hidden></div>
    </div>
    <script type="module" src="./agent-demo.ts"></script>
  </body>
</html>
