[package]
name = "luma"
version = "0.1.0"
description = "LUMA - a visual AI companion that sees your screen, talks, and points"
authors = ["Parth Mishra"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
luma-core = { path = "../crates/luma-core" }
luma-net = { path = "../crates/luma-net" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-updater = "2"
xcap = "0.9.8"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "recording", "wav"] }
keyring = "4.2.0"
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
active-win-pos-rs = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
dotenvy = "0.15.7"
enigo = "0.6.1"


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSError", "NSObject", "NSLocale", "NSURL"] }
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription"] }
block2 = "0.6"
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
