[package]
name = "luma"
version = "0.1.0"
description = "LUMA - a visual AI companion that sees your screen, talks, and points"
authors = ["Parth Mishra"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
luma-core = { path = "../crates/luma-core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.0"
xcap = "0.9.8"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "recording", "wav"] }
keyring = "4.2.0"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
active-win-pos-rs = "0.11.0"
futures-util = "0.3.34"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
