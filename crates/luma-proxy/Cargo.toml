[package]
name = "luma-proxy"
version = "0.1.0"
edition = "2021"
description = "Optional key proxy for LUMA: holds provider keys server-side and gives devices scoped, rate-limited access."

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
