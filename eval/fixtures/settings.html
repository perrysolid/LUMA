<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <style>
      body { margin: 0; background: #ececee; font-family: -apple-system, system-ui, sans-serif; color: #1c1c1e; font-size: 13px; }
      .win { position: absolute; left: 220px; top: 70px; width: 1000px; height: 760px; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.2); display: flex; overflow: hidden; }
      .side { width: 230px; background: #f5f5f7; padding: 16px 10px; }
      .side div { padding: 6px 10px; border-radius: 6px; }
      .side .on { background: #0a84ff; color: #fff; }
      .main { flex: 1; padding: 24px 32px; }
      h2 { margin: 0 0 16px; font-size: 20px; }
      .group { border: 1px solid #e5e5ea; border-radius: 10px; margin-bottom: 18px; }
      .row { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-top: 1px solid #f0f0f2; }
      .row:first-child { border-top: 0; }
      .toggle { width: 38px; height: 22px; border-radius: 11px; background: #34c759; position: relative; }
      .toggle::after { content: ""; position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; }
      .toggle.off { background: #d1d1d6; }
      .toggle.off::after { left: 2px; right: auto; }
      .button { border: 1px solid #c7c7cc; border-radius: 6px; padding: 4px 10px; }
      .muted { color: #8e8e93; }
    </style>
  </head>
  <body data-app="Acme Chat">
    <div class="win">
      <div class="side">
        <div>General</div><div class="on">Account</div><div>Appearance</div><div>Privacy</div><div>Advanced</div>
      </div>
      <div class="main">
        <h2>Account</h2>
        <div class="group">
          <div class="row"><span>Display name</span><span class="muted">Parth</span></div>
          <div class="row"><span>Email</span><span class="muted">p•••@example.com</span></div>
          <div class="row"><span>Password</span><span class="button" data-truth="btn_password" data-label="Change password">Change…</span></div>
          <div class="row"><span>Two-factor authentication</span><span class="toggle" data-truth="toggle_2fa" data-label="2FA toggle"></span></div>
        </div>
        <div class="group">
          <div class="row"><span>Desktop notifications</span><span class="toggle" data-truth="toggle_notifications" data-label="Notifications toggle"></span></div>
          <div class="row"><span>Notification sound</span><span class="toggle off" data-truth="toggle_sound" data-label="Sound toggle"></span></div>
          <div class="row"><span>Email digest</span><span class="toggle" data-truth="toggle_digest" data-label="Digest toggle"></span></div>
          <div class="row"><span>Show message previews</span><span class="toggle off" data-truth="toggle_previews" data-label="Previews toggle"></span></div>
        </div>
        <div class="group">
          <div class="row"><span>Sign out of all devices</span><span class="button" data-truth="btn_signout" data-label="Sign out everywhere">Sign out</span></div>
          <div class="row"><span style="color: #ff3b30">Delete account</span><span class="button" data-truth="btn_delete" data-label="Delete account">Delete…</span></div>
        </div>
      </div>
    </div>
    <script type="application/json" id="cases">
      [
        { "id": "settings-notifications", "kind": "locate", "q": "Where do I turn off notifications?", "expect": ["toggle_notifications"] },
        { "id": "settings-password", "kind": "locate", "q": "How can I change my password?", "expect": ["btn_password"] },
        { "id": "settings-2fa", "kind": "locate", "q": "Is two-factor turned on? Show me.", "expect": ["toggle_2fa"] },
        { "id": "settings-this-toggle", "kind": "refer", "q": "What happens if I turn this on?", "pointer": "toggle_previews", "expect": ["toggle_previews"] }
      ]
    </script>
    <script src="truth.js"></script>
  </body>
</html>
